# popsim defaults. Rates are per in-game HOUR; systems scale them by
# time.hours_per_tick. Gold amounts in config are in gold units; internally gold
# is integer cents (money.unit per gold).

seed: 42
world_name: default

time:
  hours_per_tick: 1
  days: 60

goods: [food, wood]

money:
  unit: 100              # cents per gold
  treasury_share: 0.15   # fraction of all gold that starts in city treasuries

# Fixed system order per tick (REQ-1A.2). Systems that touch shared state
# (ledger, market) always run in this order, so runs are deterministic.
pipeline: [events, regeneration, physiology, needs, consumption, decision, action, market, aging, fiscal, signals, generators, tags, metrics]

npc:
  gold: {mean: 60.0, sd: 15.0, min: 5.0}
  inventory: {food: 3, wood: 2}
  merchant_share: 0.10
  merchant_gold_multiplier: 2.0
  age_years: {mean: 35, sd: 10, min: 18, max: 65}
  life_expectancy_years: {mean: 72, sd: 8, min: 50, max: 95}

physiology:
  stamina:
    absolute_max: 100.0
    awake_drain_per_hour: 2.0
    sleep_restore_per_hour: 13.0
    good_sleep_hours: 6.5             # less than this in a day counts as skipped sleep
    deprivation_penalty_per_hour: 4.0 # daily_max lost per missing hour of sleep
    recovery_per_streak_day: 1.5      # spring elasticity: +1.5 * streak per good day
    min_daily_max: 25.0
  metabolism:
    base_burn_per_hour: 0.028
    work_multiplier: 1.6
    travel_multiplier: 1.8
    sleep_multiplier: 0.6
  health:
    base_sickness_per_hour: 0.0004
    fatigue_sickness_factor: 12.0     # extra risk as daily_max falls
    shelter_sickness_factor: 3.0      # extra risk when shelter is critical
    immune: {mean: 0.6, sd: 0.1, min: 0.1, max: 0.95}
    immune_drift_per_day: 0.03
    recovery_per_hour: 0.02
    recovery_sleep_bonus: 2.0
    sick_work_efficiency: 0.5
    sick_drain_multiplier: 1.5
    sick_death_per_hour: 0.0002

# MVP stand-in for housing upkeep (REQ-3.7 is deferred): the shelter need decays
# and is refilled by burning/using wood.
shelter:
  decay_per_hour: 0.012
  sleep_penalty_when_critical: 0.7    # sleep restores less stamina

needs:
  defaults:
    food:    {comfort: 0.60, urgent: 0.35, critical: 0.15}
    rest:    {comfort: 0.50, urgent: 0.25, critical: 0.10}
    shelter: {comfort: 0.50, urgent: 0.25, critical: 0.10}
    wealth:  {comfort: 1.00, urgent: 0.40, critical: 0.10}
  threshold_sd: 0.05
  urgency_exponent: 2.0
  death_hours_at_zero: {food: 72}
  savings_days: 5                     # wealth target = days of expected spending * thrift

# The resource contract (REQ-5B): for each good, the need it satisfies, how much a unit restores, the expected
# use per citizen per day, the process that supplies it and the signal that should trigger new supply.
# A rule `{from_resource: food}` in `generators:` takes its policy, trigger and supply from here.
resources:
  food:
    satisfies: {need: food, per_unit: 0.5}
    daily_units: 1.4
    supply: {process: field, policy: farming, at: fertile_site, reserve: 40,
             limits: {max_active: 2, cooldown_days: 2}}
    trigger: {signal: "need:food", share_gt: 0.10, for_days: 1}
  wood:
    satisfies: {need: shelter, per_unit: 0.5}
    daily_units: 0.6
    supply: {process: grove, policy: forestry, at: fertile_site, reserve: 20,
             limits: {max_active: 2, cooldown_days: 2}}
    trigger: {signal: "need:shelter", share_gt: 0.10, for_days: 1}
  seed:
    input: true                  # used up by processes, not by a need
    byproduct_of: food           # food nodes yield it while they are gathered
    consumed_by: [field]

traits:
  risk:              {mean: 0.5, sd: 0.2, min: 0.0, max: 1.0}
  urgency_tolerance: {mean: 0.5, sd: 0.2, min: 0.0, max: 1.0}
  thrift:            {mean: 1.0, sd: 0.25, min: 0.3, max: 2.0}
  luxury:            {mean: 0.5, sd: 0.2, min: 0.0, max: 1.0}
  forecast_noise:    {mean: 0.05, sd: 0.03, min: 0.0, max: 0.3}
  reactivity:        {mean: 1.0, sd: 0.3, min: 0.2, max: 2.5}
  need_weight:       {mean: 1.0, sd: 0.2, min: 0.3, max: 2.0}
  job_preference:    {mean: 0.0, sd: 0.3, min: -1.0, max: 1.0}
  stock_days:        {mean: 2.0, sd: 0.7, min: 1.0, max: 4.0}

skills: {sigma: 0.25, min: 0.4, max: 2.5}   # lognormal around 1.0, per good

decision:
  work_drive: 0.35
  night_start: 22
  night_end: 6
  night_sleep_bonus: 0.8
  night_work_factor: 0.5
  shift_hours: 4
  max_sleep_hours: 9
  idle_score: 0.05
  job_weights: {income: 1.0, preference: 0.2, skill: 0.2}
  survival_food_job_bonus: 1.0        # starving + no food => gather food yourself
  self_supply_weight: 0.8             # gather a need good yourself when the market fails you
  work_hours_per_day: 8               # reservation wage = daily spend / these hours
  starving_buy_patience: 0.3         # bid premium at which a starving NPC gives up buying and gathers

# The player account of the Market tab (REQ-1C.9). Opened on demand, never by the scenario.
# gold: exact opening balance in gold units; when null it is gold_share of the gold the citizens started with.
player:
  gold_share: 0.5
  gold: null
  goods: {}

pricing:
  ema_alpha_per_hour: 0.1
  initial_prices: {food: 2.0, wood: 2.0}
  bid_urgency_markup: 0.6
  wealth_bid_elasticity: 0.25
  wealth_bid_bounds: [0.8, 1.6]
  max_unit_budget_share: [0.08, 0.5] # share of gold one unit may cost, by urgency
  unit_budget_urgency_slope: 0.12
  ask_wealth_markup: 0.15
  ask_desperation: 0.3
  adapt_step: 0.04
  adapt_decay: 0.6
  adapt_cap: 0.8
  order_ttl_hours: 2

merchant:
  carry_capacity: 30
  min_profit_gold: 3.0
  stamina_value_gold: 0.05
  sell_margin_safety: 0.10
  max_buy_wait_hours: 6
  max_sell_wait_hours: 24
  budget_share: 0.7
  scout: true
  min_stamina_to_travel: 20.0

cities: []
roads: []
events: []

# Taxes and public spending (REQ-5.5). Policy is fixed per scenario; every city may override it with
# its own `fiscal:` block. All zero by default, so a scenario without it has no taxes and no support.
fiscal:
  income_tax: 0.0         # share of wages and of sales proceeds, kept by the city where they are earned
  sales_tax: 0.0          # share of each transaction's value, paid by the buyer to the city of the market
  support:
    amount: 0.0           # gold per day for each resident with a survival need at or below its urgent level
    hour: 8               # hour of the day it is paid
  public_jobs:
    stamina_per_hour: 3.5 # default for workplaces: the effort of public work
    slots: 3              # default number of people a workplace employs at once

# Demand, jobs and policies (REQ-5A). Needs and blocked tasks put signals on a city's demand board; generators
# are rules that create jobs when a signal is strong enough; a policy is a named switch for a group of
# generators. Every policy is off by default, so a scenario without `policies:` runs exactly as before.
signals:
  hour: 8                 # hour of the day the board is sampled and the generators run
  needs: [food, shelter, rest]   # one `need:<name>` signal each: residents at or below the urgent level
  max_points: 40          # positions kept per signal for drawing the points on the map

policies:
  farming:
    enabled: false
    title: Farming
    description: When more than the set share of a city's people are in urgent need of food, its treasury commissions a new field outside the city. Citizens fetch seeds from the estate office, plant the field, and after a while it becomes a food spot.
  forestry:
    enabled: false
    title: Forestry
    description: When more than the set share of a city's people are in urgent need of shelter, its treasury commissions a grove outside the city. Citizens plant it, and after a while it becomes a wood spot.

# The land (REQ-5A.2): fertility f(x, y) in [0, 1] and the rules for where a site may go.
fertility:
  seed: 7
  scale: 14.0
  octaves: 3
  blobs: []               # [{at: [x, y], radius, strength}] spots of good land
  min_fertility: 0.45     # land below this cannot be planted
  min_spacing: 3.0        # distance to other nodes and sites
  max_offset: 14.0        # how far off the road a site may be
  distance_penalty: 0.02  # fertility given up per hour of walking from the city
  city_margin: 0.5        # clearance outside a city's radius

# Sites (REQ-5A.7): what a tag waits for (`requires`: items, labor_hours, timer_days) and what happens next.
# `task` says how citizens do the work: the wage (gold per hour, paid by the commissioning city), the stamina,
# the slots, a timeout, the `service` (an office that must be staffed to hand out the items) and `raise_wage`:
# while nobody takes the task the treasury raises its wage each day by `step`, up to `max` times the base.
processes:
  field:
    tags: [planting_spot, waiting_seeds]
    waiting_seeds:
      requires: {items: {seed: 5}, labor_hours: 2}
      task: {label: plant, wage: 3.0, stamina_per_hour: 3.5, slots: 2, timeout_days: 8, service: estate_finance,
              raise_wage: {step: 0.5, max: 5.0}}
      on_done: {remove: [waiting_seeds], add: [growing]}
    growing:
      requires: {timer_days: 3.0, timer_scaled_by: fertility}
      on_done: {remove: [growing, planting_spot], add: [food_spot]}
    food_spot:
      on_enter:
        - spawn_node: {good: food, initial_frac: 0.15, max_amount: 300, regen_per_hour: 4.0, base_rate: 0.7,
                       stamina_cost: 5.0, byproduct: {seed: 0.1}}
  grove:
    tags: [planting_spot, waiting_labor]
    waiting_labor:
      requires: {labor_hours: 3}
      task: {label: plant trees, wage: 3.0, stamina_per_hour: 3.5, slots: 2, timeout_days: 8,
              raise_wage: {step: 0.5, max: 5.0}}
      on_done: {remove: [waiting_labor], add: [growing]}
    growing:
      requires: {timer_days: 4.0, timer_scaled_by: fertility}
      on_done: {remove: [growing, planting_spot], add: [wood_spot]}
    wood_spot:
      on_enter:
        - spawn_node: {good: wood, initial_frac: 0.15, max_amount: 300, regen_per_hour: 3.5, base_rate: 0.7,
                       stamina_cost: 5.0}

# Generators (REQ-5A.6). `when`: a signal and a threshold (`share_gt` of residents, or `count_gte`) held for
# `for_days`. `create`: a `process` placed `at` a placement (fertile_site), or a `workplace` placed in_city;
# `reserve` is the gold the treasury must hold. `limits`: max_active, cooldown_days, max_per_city.
# `policy`: the policy whose switch enables the rule; a rule without one is always on.
generators:
  plant_food: {from_resource: food}     # policy, trigger and supply come from the resource contract
  plant_trees: {from_resource: wood}
  finance_office:
    when: {signal: "service:estate_finance", count_gte: 1, for_days: 1, min_population: 20}
    create: {workplace: {task: estate_finance, slots: 1, wage: 3.0, stamina_per_hour: 2.0,
                         raise_wage: {step: 0.5, max: 5.0}}, at: in_city, treasury_days: 5}
    close_when: {idle_days: 5}
    limits: {max_per_city: 1}

# Space and movement (REQ-3A). Distances are in abstract units (1 unit = 1 km). Speeds are
# units per hour; stamina costs are per unit of distance.
movement:
  walk: {speed: 5.0, stamina_per_unit: 0.8}   # inside a city
  road: {speed: 5.0, stamina_per_unit: 0.5}   # between cities: derives a road's hours and stamina_cost
  arrival_radius: 0.05                        # an NPC is "at" a position within this distance
  home_rest_multiplier: 1.25                  # sleeping in one's own house restores this much faster
  default_city_radius: 2.0

# Dashboard inspector (REQ-1C.5, REQ-1C.6). Recording only reads simulation state:
# results are identical with it on or off. Turn it off to save memory.
inspector:
  record: true
  buffer: 500            # entries kept per NPC for each of fills, actions, tasks, daily totals
  dead_keep_days: 30     # how long a dead citizen stays inspectable

output:
  keep_ledger_log: true
