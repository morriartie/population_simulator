[project]
name = "popsim"
version = "0.1.0"
description = "Agent-based society simulation with emergent macroeconomics (ECS, pure Python)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pyyaml>=6.0.2",
]

[project.scripts]
popsim = "popsim.cli:main"
popsim-api = "popsim.market.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: multi-run acceptance scenarios (deselect with -m 'not slow')"]
